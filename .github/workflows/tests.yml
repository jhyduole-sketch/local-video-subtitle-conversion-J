name: Regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    env:
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-core.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install core dependencies and package
        run: |
          python -m pip install -r requirements-core.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Browser state regression tests
        run: node --test tests/*.cjs
      - name: Syntax and whitespace
        run: |
          python -m compileall -q src tests
          for file in src/subtitle_tool/web_assets/*.js; do node --check "$file"; done
          git diff --check
